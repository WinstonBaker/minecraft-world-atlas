<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f4eb"><meta name="description" content="Make a little world of your own. A hand-drawn fantasy map editor with places, paths, and stories."><title>Minecraft World Atlas</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><strong class="brand">World Atlas</strong><span id="save-status" role="status">Saved</span></header>
<main>
<aside class="tool-panel" aria-label="Drawing tools"><div id="tools" class="tools"></div><button id="new-world">New map</button></aside>
<section class="workspace" aria-label="Map editor"><div class="map-heading"><div><input id="world-title" aria-label="World title" maxlength="120" value="Untitled world"></div><div class="history"><button id="undo" title="Undo (Ctrl or Command Z)" aria-label="Undo">Undo</button><button id="redo" title="Redo (Ctrl or Command Shift Z)" aria-label="Redo">Redo</button></div></div>
<div id="map-wrap"><svg id="map" aria-label="Interactive fantasy map" role="application" tabindex="0" xmlns="http://www.w3.org/2000/svg"><defs>
<pattern id="paper" width="80" height="80" patternUnits="userSpaceOnUse"><circle cx="7" cy="12" r=".65" fill="#a49673" opacity=".18"/><circle cx="41" cy="62" r=".8" fill="#a49673" opacity=".14"/><path d="M22 34h2m39-12h1" stroke="#938a70" opacity=".14"/></pattern>
<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#8e9b85" stroke-width=".6" opacity=".25"/></pattern>
<symbol id="tree" viewBox="-18 -40 36 48"><path d="M-2-5l1 12h4L2-6" fill="#8d7853"/><path d="M0-38L-12-18h5L-18-2Q0 5 18-2L7-18h5Z" fill="currentColor" stroke="#425d49" stroke-width="1.3" stroke-linejoin="round"/><path d="M0-30l-6 13m8 5l-4 12" stroke="#c5d1aa" opacity=".6" fill="none"/></symbol>
<symbol id="peak" viewBox="-40 -55 80 65"><path d="M-38 7L-6-49 3-53 38 7Q7 14-38 7" fill="currentColor" stroke="#626c5c" stroke-width="1.5" stroke-linejoin="round"/><path d="M-6-49L-21-20l12 4 7-11 12 11 9-3L3-53Z" fill="#f8f4e6" stroke="#75806c" stroke-width="1"/><path d="M3-46L0-8 13 8" fill="none" stroke="#6c7964" opacity=".5"/></symbol>
<symbol id="house" viewBox="-24 -40 48 50"><path d="M-18-14L-18 9H18V-14" fill="#f4dfb0" stroke="#76674d" stroke-width="1.5"/><path d="M-23-12L0-35 23-12Z" fill="currentColor" stroke="#76674d" stroke-width="1.5" stroke-linejoin="round"/><path d="M-4 9V-6H4V9m6-23v-13h5v17" fill="#8c7657" stroke="#76674d"/><path d="M-12-6h5v6h-5m17-6h5v6H5" fill="#f9eaba" stroke="#76674d" stroke-width="1"/></symbol>
</defs><g id="viewport"><g id="backdrop"></g><g id="features"></g><g id="draft" pointer-events="none"></g><g id="handles"></g></g></svg>
<div class="canvas-controls"><button id="toggle-grid" aria-label="Toggle grid" aria-pressed="false" title="Toggle grid">Grid</button><div class="zoom"><button id="zoom-out" aria-label="Zoom out">−</button><output id="zoom-level">100%</output><button id="zoom-in" aria-label="Zoom in">＋</button></div><button id="fit" title="Fit world in view" aria-label="Fit map">Fit</button></div></div>
</section>
<aside class="details-panel"><div class="panel-tabs"><button class="active" id="tab-feature">Details</button><button id="tab-layers">Layers</button></div><section id="feature-panel"></section><section id="layers-panel" hidden><div id="layers"></div></section></aside>
</main><div id="toast" role="status" hidden></div><dialog id="new-dialog"><h2>Start a new map?</h2><p>This replaces your current map. You can undo it during this session.</p><div><button id="cancel-new">Cancel</button><button id="confirm-new" class="primary">Start new map</button></div></dialog>
<script type="module" src="app.js"></script></body></html>
